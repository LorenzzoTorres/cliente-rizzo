<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente | Rizzo</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page-shell">
        <section class="card form-card">
            <div class="brand">
                <img src="/logo-rizzo.png" alt="Rizzo">
            </div>

            <div class="title-area">
                <span class="eyebrow">RIZZO</span>
                <h1>Cadastro de Cliente</h1>
                <p>Preencha seus dados para realizar o cadastro.</p>
            </div>

            <form id="clienteForm" class="form">
                <input type="hidden" id="token" name="token">

                <div class="section-title full">Dados do cliente</div>

                <div class="field">
                    <label for="nome">Nome / Razão Social *</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="field">
                    <label for="cpf_cnpj">CPF / CNPJ *</label>
                    <input type="text" id="cpf_cnpj" name="cpf_cnpj" maxlength="18" required>
                </div>

                <div class="field">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="15" required>
                </div>

                <div class="section-title full">Endereço</div>

                <div class="field">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" name="cep" maxlength="9" inputmode="numeric" required>
                </div>

                <div class="field">
                    <label for="endereco">Endereço *</label>
                    <input type="text" id="endereco" name="endereco" required>
                </div>

                <div class="field">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero">
                </div>

                <div class="field">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento">
                </div>

                <div class="field">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro">
                </div>

                <div class="field">
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div class="field">
                    <label for="estado">Estado *</label>
                    <input type="text" id="estado" name="estado" maxlength="2" required>
                </div>

                <div class="section-title full delivery-title">
                    Endereço de entrega
                </div>

                <label class="checkbox-row full">
                    <input type="checkbox" id="mesmoEndereco" checked>
                    <span>O endereço de entrega é o mesmo do cadastro</span>
                </label>

                <div id="enderecoEntrega" class="delivery-grid full hidden">
                    <div class="field">
                        <label for="cep_entrega">CEP</label>
                        <input type="text" id="cep_entrega" name="cep_entrega" maxlength="9" inputmode="numeric">
                    </div>

                    <div class="field">
                        <label for="endereco_entrega">Endereço</label>
                        <input type="text" id="endereco_entrega" name="endereco_entrega">
                    </div>

                    <div class="field">
                        <label for="numero_entrega">Número</label>
                        <input type="text" id="numero_entrega" name="numero_entrega">
                    </div>

                    <div class="field">
                        <label for="complemento_entrega">Complemento</label>
                        <input type="text" id="complemento_entrega" name="complemento_entrega">
                    </div>

                    <div class="field">
                        <label for="bairro_entrega">Bairro</label>
                        <input type="text" id="bairro_entrega" name="bairro_entrega">
                    </div>

                    <div class="field">
                        <label for="cidade_entrega">Cidade</label>
                        <input type="text" id="cidade_entrega" name="cidade_entrega">
                    </div>

                    <div class="field">
                        <label for="estado_entrega">Estado</label>
                        <input type="text" id="estado_entrega" name="estado_entrega" maxlength="2">
                    </div>
                </div>

                <button type="submit" class="button primary full" id="enviarBtn">
                    Enviar cadastro
                </button>

                <p id="mensagem" class="status full"></p>
            </form>
        </section>
    </main>

    <script src="/cadastro.js"></script>
</body>
</html>
